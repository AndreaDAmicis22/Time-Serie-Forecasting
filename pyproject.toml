[project]
name = "stock-forecast"
version = "0.1.0"
description = "Time-series stock/commodity forecasting with foundation models, ensembles and a web app"
authors = [
    {name = "Andrea D'Amicis"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "yfinance",
    "pandas",
    "numpy",
    "transformers",
    "torch",
    "accelerate",
    "neuralforecast",
    "matplotlib",
    "plotly",
    "python-dotenv",
    "requests",
    "scipy",
    "chronos-forecasting (>=2.2.2,<3.0.0)",
    "statsmodels",
    "xgboost",
    "streamlit (>=1.50)",
]

[project.optional-dependencies]
# Extra foundation models – see README for their licenses.
timesfm = ["timesfm[torch] (>=3.0.0)"]
tirex = ["tirex-ts (>=1.4.0)"]
timestral = ["timestral @ git+https://github.com/mistralai/timestral.git"]

[tool.poetry]
packages = [{ include = "stock_forecast", from = "src" }]

[tool.poetry.group.dev.dependencies]
ipykernel = ">=6.29.0,<8.0.0"
jupyter = ">=1.0.0"
nbformat = ">=5.9.0"
pytest = ">=8.0"
ruff = ">=0.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: downloads pretrained weights or trains neural networks (run with `pytest -m slow`)"]
addopts = "-m 'not slow'"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
